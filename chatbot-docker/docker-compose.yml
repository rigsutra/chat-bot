version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        limits:
          memory: 8G # Llama 3 8B + 8k context needs decent RAM
    restart: always

  chatbot:
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODEL_NAME=llama3
    depends_on:
      ollama:
        condition: service_healthy
    restart: always

volumes:
  ollama_models: